---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: bluefin-vjs-edition
description: This is my personal OS image.

base-image: ghcr.io/ublue-os/bluefin-dx
image-version: latest

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      copr:
        - sneexy/floorp
        - deltacopy/darkly
        - gundulabs/gaze        
    install:
      packages:
        - floorp
        - steam
        - waydroid
        - qt5ct
        - qt6ct
        - darkly
        - zsh
        - mangohud
        - gamescope
        - java-latest-openjdk
        - gaze
        - gaze-gui
        - gaze-gnome-extension
    remove:
      packages:
        - firefox
        - firefox-langpacks

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - io.github.Foldex.AdwSteamGtk
          - dev.qwery.AddWater
          - com.moonlight_stream.Moonlight
          
      - scope: user

  - type: signing
