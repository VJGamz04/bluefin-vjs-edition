---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: bluefin-vjs-edition
description: This is my personal OS image.

base-image: ghcr.io/ublue-os/bluefin-dx
image-version: latest

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      copr:
        - sneexy/floorp
    install:
      packages:
        - floorp
        - steam
        - waydroid
        - qt5ct
        - qt6ct
    remove:
      packages:
        - firefox
        - firefox-langpacks

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - io.github.Foldex.AdwSteamGtk
          - dev.qwery.AddWater

      - scope: user

  - type: signing
